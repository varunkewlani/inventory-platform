name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Install
        working-directory: backend
        run: ./mvnw -B dependency:go-offline

      # AbstractIntegrationTest requests withReuse(true) on its MySQL/Redis
      # containers, which Testcontainers only honors when this file opts in
      # globally — without it, container reuse across integration test
      # classes within the same run silently doesn't happen as designed.
      - name: Enable Testcontainers reuse
        run: echo "testcontainers.reuse.enable=true" > ~/.testcontainers.properties

      # Unit + integration tests (including the mandatory concurrency test)
      # run in the same step — Testcontainers spins up real, disposable
      # MySQL/Redis containers using the Docker daemon GitHub-hosted runners
      # already provide, no extra setup needed.
      - name: Test
        working-directory: backend
        run: ./mvnw -B test

      - name: Build
        working-directory: backend
        run: ./mvnw -B package -DskipTests

      - name: Build Docker image
        working-directory: backend
        run: docker build -t inventory-platform-backend:${{ github.sha }} .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Build Docker image
        working-directory: frontend
        run: docker build -t inventory-platform-frontend:${{ github.sha }} .
